<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Clocktown</title>
<meta name="theme-color" content="#0e1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">

  <!-- Open Graph for PWA Reader -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mousekin-story.vercel.app/app/">
  <meta property="og:title" content="Там, где заводится время — Интерактивная книга (PWA)">
  <meta property="og:description" content="Интерактивное музыкальное приключение о Мышонке в Городе Часов. 22 анимированные сцены, студийная озвучка (RU/EN/DE), караоке-подсветка текста. Читайте онлайн без скачивания!">
  <meta property="og:image" content="https://mousekin-story.vercel.app/images/og-preview-ru.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://mousekin-story.vercel.app/images/og-preview-ru.png">

</head>
<body>
<div id="app">
  <div id="viewport"></div>

  <div id="textPanel" hidden>
    <div id="textInner"></div>
    <button id="textClose" aria-label="Закрыть текст" title="Закрыть текст">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <a id="btnHomeTopLeft" href="/" aria-label="На сайт" title="На сайт" class="ui" hidden>
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    <span class="btnHome-text">На сайт</span>
  </a>

  <div id="topbar" class="ui" hidden>
    <button id="btnPages" aria-label="Pages" title="Pages">
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
    </button>
    <div id="langs" role="group" aria-label="Language"></div>
    <button id="btnNarr" aria-label="Narration" title="Narration">
      <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/><path class="off" d="M4 4l16 16" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button id="btnSfx" aria-label="Sound and music" title="Sound and music">
      <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="off" d="M4 4l16 16" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button id="btnText" aria-label="Text" title="Текст">
      <svg viewBox="0 0 24 24"><path d="M5 5h14v3.5h-5v10.5h-4V8.5H5z"/></svg>
    </button>
    <button id="btnOffline" aria-label="Скачать для офлайна" title="Скачать для офлайна">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z" fill="currentColor"/></svg>
      <span id="offlineBadge"></span>
    </button>
    <button id="btnInstall" aria-label="Установить приложение" title="Установить приложение" hidden>
      <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14zm-4-6h3l-4 4-4-4h3V9h2v4z" fill="currentColor"/></svg>
    </button>
  </div>

  <button id="navPrev" class="nav ui" aria-label="Previous" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="navNext" class="nav ui" aria-label="Next" hidden><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="pageNo" class="ui" hidden></div>

  <div id="pages" hidden>
    <div id="pagesGrid"></div>
    <button id="pagesClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke-width="2.6" stroke-linecap="round"/></svg></button>
  </div>

  <div id="start">
    <div id="startBg"></div>
    <div id="startCard">
      <h1 id="startTitle"></h1>
      <div id="startAuthor"></div>
      <div id="startLangs" role="group"></div>
      <button id="startBtn" disabled>…</button>
      <div id="startNote"></div>
    </div>
  </div>

  <div id="loader" hidden><i></i></div>
  <div id="toast" hidden></div>
</div>
<script src="app.js"></script>
<script src="games/games.js" defer></script>
</body>
</html>
